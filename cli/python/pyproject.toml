[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hawk-homelab"
version = "1.0.0"
description = "Scaffold a new homelab project using the Hawk methodology"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["homelab", "hawk", "scaffold", "docker", "mac-pro"]

[project.scripts]
hawk-homelab = "hawk_homelab.cli:main"
