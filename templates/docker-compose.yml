# docker-compose.yml — {{PROJECT_NAME}} 服务定义
# 由 create-hawk-homelab 生成
# 目标环境: Mac Pro 6,1 (2013), Colima (QEMU x86_64)

services:
  {{PROJECT_NAME}}:
    image: {{IMAGE}}:{{VERSION}}
    container_name: hawk-{{PROJECT_NAME}}
    restart: unless-stopped
    ports:
      - "{{PORT}}:{{INTERNAL_PORT}}"
    volumes:
      - {{PROJECT_NAME}}-data:/data
    networks:
      - app-net
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:{{INTERNAL_PORT}}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "hawk.project={{PROJECT_NAME}}"
      - "hawk.managed=true"

volumes:
  {{PROJECT_NAME}}-data:

networks:
  app-net:
    external: true
